<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --income-color: #28a745;
            --expense-color: #dc3545;
            --primary-color: #0d6efd;
        }
        
        body {
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }
        
        body.dark-mode {
            background-color: #212529;
            color: #f8f9fa;
        }
        
        body.dark-mode .card {
            background-color: #2c3034;
            border-color: #495057;
        }
        
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .positive { color: var(--income-color); }
        .negative { color: var(--expense-color); }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        #incomeRadio:checked {
            background-color: var(--income-color);
            border-color: var(--income-color);
        }
        
        #expenseRadio:checked {
            background-color: var(--expense-color);
            border-color: var(--expense-color);
        }
        
        .form-check-label {
            margin-left: 5px;
            font-weight: 500;
        }
        
        .btn-success {
            background: linear-gradient(135deg, var(--income-color), #5cb85c);
            border: none;
            box-shadow: 0 2px 5px rgba(40, 167, 69, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, var(--expense-color), #e35d6a);
            border: none;
        }
        
        .balance-display {
            transition: all 0.3s ease;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
        }
        
        .balance-display.positive {
            background: rgba(40, 167, 69, 0.1);
        }
        
        .balance-display.negative {
            background: rgba(220, 53, 69, 0.1);
        }
        
        .list-group-item {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border-radius: 8px !important;
            margin-bottom: 8px;
        }
        
        .list-group-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        
        #mobile-add-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: none;
        }
        
        @media (max-width: 768px) {
            #mobile-add-btn {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-center mb-0">Personal Finance Tracker</h1>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="darkModeToggle">
                <label class="form-check-label" for="darkModeToggle"><i class="bi bi-moon"></i></label>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="input-section">
                    <div class="row g-2">
                        <div class="col-12 col-md-5">
                            <input type="text" id="description" class="form-control" placeholder="Description" required>
                        </div>
                        <div class="col-12 col-md-5">
                            <input type="number" 
                                   id="amount" 
                                   class="form-control" 
                                   placeholder="Amount" 
                                   required 
                                   step="0.01"
                                   inputmode="decimal"
                                   pattern="[0-9]*">
                        </div>
                        <div class="col-12 col-md-2">
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="transactionType" id="incomeRadio" value="income" checked>
                                    <label class="form-check-label" for="incomeRadio">Gain</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="transactionType" id="expenseRadio" value="expense">
                                    <label class="form-check-label" for="expenseRadio">Owe</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="d-grid gap-2 mt-3">
                        <button id="add-transaction" class="btn btn-success">
                            <i class="bi bi-plus-circle"></i> Add Transaction
                        </button>
                        <button id="save-transaction" class="btn btn-primary" style="display: none;">
                            <i class="bi bi-save"></i> Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body text-center">
                <h2 class="mb-3">Balance</h2>
                <div id="balance" class="balance-display fs-2 fw-bold">$0.00</div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Transaction History</h2>
                    <button id="toggle-history" class="btn btn-info">
                        <i class="bi bi-chevron-down"></i> Toggle
                    </button>
                </div>
                <div class="history-section" id="history-section">
                    <ul id="history-list" class="list-group"></ul>
                </div>
            </div>
        </div>

        <div class="d-grid gap-2">
            <button id="export-data" class="btn btn-secondary">
                <i class="bi bi-download"></i> Export to CSV
            </button>
            <button id="clear-data" class="btn btn-danger">
                <i class="bi bi-trash"></i> Clear All Data
            </button>
        </div>
    </div>

    <button id="mobile-add-btn" class="btn btn-success shadow">
        <i class="bi bi-plus fs-4"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
