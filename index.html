<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <!-- Mobile web app capable meta tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Finance Tracker">
    <!-- iOS home screen icons -->
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="assets/icons/icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="assets/icons/icon-167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/icon-180.png">
    <link rel="apple-touch-startup-image" href="assets/icons/splash-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="assets/icons/splash-1668x2224.png" media="(device-width: 834px) and (device-height: 1112px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="assets/icons/splash-1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="assets/icons/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
    <link rel="apple-touch-startup-image" href="assets/icons/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
    <!-- Web app manifest -->
    <link rel="manifest" href="manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --income-color: #28a745;
            --expense-color: #dc3545;
            --primary-color: #0d6efd;
        }
        
        body {
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }
        
        body.dark-mode {
            background-color: #212529;
            color: #f8f9fa;
        }
        
        body.dark-mode .card {
            background-color: #2c3034;
            border-color: #495057;
        }
        
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .positive { color: var(--income-color); }
        .negative { color: var(--expense-color); }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        #incomeRadio:checked {
            background-color: var(--income-color);
            border-color: var(--income-color);
        }
        
        #expenseRadio:checked {
            background-color: var(--expense-color);
            border-color: var(--expense-color);
        }
        
        .form-check-label {
            margin-left: 5px;
            font-weight: 500;
        }
        
        .btn-success {
            background-color: var(--income-color);
            border: none;
        }
        
        .btn-danger {
            background-color: var(--expense-color);
            border: none;
        }
        
        .balance-display {
            transition: all 0.3s ease;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
        }
        
        .balance-display.positive {
            background: rgba(40, 167, 69, 0.1);
        }
        
        .balance-display.negative {
            background: rgba(220, 53, 69, 0.1);
        }
        
        .list-group-item {
            transition: transform 0.2s ease;
            border-radius: 8px !important;
            margin-bottom: 8px;
        }
        
        #mobile-add-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: none;
        }
        
        @media (max-width: 768px) {
            #mobile-add-btn {
                display: block;
            }
            .history-section {
                max-height: 60vh;
                overflow-y: auto;
            }
            .list-group-item {
                padding: 12px;
            }
            .badge {
                font-size: 0.75rem;
                padding: 0.25em 0.5em;
            }
            .btn-sm {
                padding: 0.25rem 0.5rem;
            }
        }

        .category-badge {
            padding: 0.3em 0.6em;
            border-radius: 1rem;
            font-size: 0.875em;
            font-weight: 600;
            white-space: nowrap;
            color: white;
        }

        .list-group-item .transaction-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .transaction-info {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .transaction-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875em;
            color: #6c757d;
        }

        #category-filter {
            min-width: 150px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-center mb-0">Personal Finance Tracker</h1>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="darkModeToggle">
                <label class="form-check-label" for="darkModeToggle"><i class="bi bi-moon"></i></label>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="input-section">
                    <div class="row g-2">
                        <div class="col-12 col-md-4">
                            <input type="text" id="description" class="form-control" placeholder="Description" required>
                        </div>
                        <div class="col-12 col-md-3">
                            <input type="number" 
                                   id="amount" 
                                   class="form-control" 
                                   placeholder="Amount" 
                                   required 
                                   step="0.01"
                                   inputmode="decimal"
                                   pattern="[0-9]*">
                        </div>
                        <div class="col-12 col-md-3">
                            <select id="category" class="form-select" required>
                                <option value="">Select Category</option>
                                <optgroup label="Income">
                                    <option value="salary" data-color="#28a745">Salary</option>
                                    <option value="freelance" data-color="#20c997">Freelance</option>
                                    <option value="investments" data-color="#198754">Investments</option>
                                    <option value="other-income" data-color="#25ba4e">Other Income</option>
                                </optgroup>
                                <optgroup label="Expenses">
                                    <option value="food" data-color="#dc3545">Food & Dining</option>
                                    <option value="transport" data-color="#fd7e14">Transport</option>
                                    <option value="bills" data-color="#6f42c1">Bills & Utilities</option>
                                    <option value="shopping" data-color="#e83e8c">Shopping</option>
                                    <option value="entertainment" data-color="#0dcaf0">Entertainment</option>
                                    <option value="health" data-color="#20c997">Healthcare</option>
                                    <option value="education" data-color="#0d6efd">Education</option>
                                    <option value="other-expense" data-color="#6c757d">Other Expense</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="col-12 col-md-2">
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="transactionType" id="incomeRadio" value="income" checked>
                                    <label class="form-check-label" for="incomeRadio">Gain</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="transactionType" id="expenseRadio" value="expense">
                                    <label class="form-check-label" for="expenseRadio">Owe</label>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="d-grid gap-2 mt-3">
                        <button id="add-transaction" class="btn btn-success">
                            <i class="bi bi-plus-circle"></i> Add Transaction
                        </button>
                        <button id="save-transaction" class="btn btn-primary" style="display: none;">
                            <i class="bi bi-save"></i> Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body text-center">
                <h2 class="mb-3">Balance</h2>
                <div id="balance" class="balance-display fs-2 fw-bold">$0.00</div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="mb-0">Transaction History</h2>
                    <div class="d-flex gap-2 align-items-center">
                        <select id="category-filter" class="form-select form-select-sm">
                            <option value="">All Categories</option>
                            <optgroup label="Income">
                                <option value="salary">Salary</option>
                                <option value="freelance">Freelance</option>
                                <option value="investments">Investments</option>
                                <option value="other-income">Other Income</option>
                            </optgroup>
                            <optgroup label="Expenses">
                                <option value="food">Food & Dining</option>
                                <option value="transport">Transport</option>
                                <option value="bills">Bills & Utilities</option>
                                <option value="shopping">Shopping</option>
                                <option value="entertainment">Entertainment</option>
                                <option value="health">Healthcare</option>
                                <option value="education">Education</option>
                                <option value="other-expense">Other Expense</option>
                            </optgroup>
                        </select>
                        <button id="toggle-history" class="btn btn-info btn-sm">
                            <i class="bi bi-chevron-down"></i> Show
                        </button>
                    </div>
                </div>
                <div class="history-section" id="history-section" style="display: none;">
                    <ul id="history-list" class="list-group"></ul>
                </div>
            </div>
        </div>

        <div class="d-grid gap-2">
            <button id="export-data" class="btn btn-secondary">
                <i class="bi bi-download"></i> Export to CSV
            </button>
            <button id="clear-data" class="btn btn-danger">
                <i class="bi bi-trash"></i> Clear All Data
            </button>
        </div>
    </div>

    <button id="mobile-add-btn" class="btn btn-success shadow">
        <i class="bi bi-plus fs-4"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
