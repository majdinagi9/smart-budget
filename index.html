<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .positive { color: green; }
        .negative { color: red; }
        .form-check-input:checked {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Personal Finance Tracker</h1>

        <div class="input-section mb-4">
            <div class="row g-2">
                <div class="col-12 col-md-5">
                    <input type="text" id="description" class="form-control" placeholder="Description" required>
                </div>
                <div class="col-12 col-md-5">
                    <input type="number" id="amount" class="form-control" placeholder="Amount" required step="0.01">
                </div>
                <div class="col-12 col-md-2">
                    <div class="d-flex gap-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="transactionType" id="incomeRadio" value="income" checked>
                            <label class="form-check-label" for="incomeRadio">+</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="transactionType" id="expenseRadio" value="expense">
                            <label class="form-check-label" for="expenseRadio">-</label>
                        </div>
                    </div>
                </div>
            </div>
            <div class="d-grid gap-2 mt-2">
                <button id="add-transaction" class="btn btn-success">Add Transaction</button>
                <button id="save-transaction" class="btn btn-primary" style="display: none;">Save Changes</button>
            </div>
        </div>

        <div class="balance-section text-center mb-4">
            <h2>Balance</h2>
            <div id="balance" class="fs-2 fw-bold">$0.00</div>
        </div>

        <button id="toggle-history" class="btn btn-info w-100 mb-4">Show Transaction History</button>

        <div class="history-section" id="history-section" style="display: none;">
            <h2 class="mb-3">Transaction History</h2>
            <ul id="history-list" class="list-group"></ul>
        </div>

        <button id="export-data" class="btn btn-secondary w-100 mb-4">Export to CSV</button>

        <button id="clear-data" class="btn btn-danger w-100">Clear All Data</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
